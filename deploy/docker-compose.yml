# StarX Kiosk na VPS: API + Postgres + backup diário.
# O Caddy que já existe na VPS faz o HTTPS e encaminha para a API (veja Caddyfile.snippet).
# A API escuta em API_BIND:API_PORT. Caddy na mesma máquina: 127.0.0.1. Caddy em outra VM: o IP interno desta VM
# (e o firewall libera a porta só para a VM do Caddy).
# Logs dos contêineres com limite (3 arquivos de 10 MB por serviço): sem isso crescem sem fim, com o IP de cada
# requisição (LGPD: prazo de guarda, .lgpd/retention.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    logging: *logging
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kiosk:${POSTGRES_PASSWORD}@postgres:5432/kiosk
      APK_DIR: /data/apks
      APPS_DIR: /data/apps
      PORT: "3100"
      TRUST_PROXY: "true"
    volumes:
      - ./data/apks:/data/apks
      # repositório de apps (APKs enviados pelo painel): entra no backup junto com o banco
      - ./data/apps:/data/apps
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kiosk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk"]
      interval: 10s
      timeout: 5s
      retries: 10

  # pg_dump diário em ./backups, cifrado com a chave pública BACKUP_AGE_RECIPIENT (mantém os últimos 14; backup.sh)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
